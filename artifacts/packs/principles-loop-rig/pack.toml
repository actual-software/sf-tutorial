# principles-loop-rig — rig-scoped pack that adds depth to the
# architecture review lane: a per-principle scoring loop that scores
# every polecat diff against 23 canonical Gas City architecture
# principles, with an append-only audit trail per bead.
#
# What this pack contributes:
#   1. `mol-principles-review` — replaces `mol-architect-review` as
#      the formula the base factory's architect pours. Scores the
#      diff against 23 principles (0-5 per principle), appends one row
#      per principle to `docs/reviews/principles.<bead-id>.yaml`,
#      writes detailed per-principle findings to
#      `docs/reviews/principles/<bead-id>.<slug>.md`. The
#      aggregator decides PASS / CONTINUE / ESCALATE based on
#      aggregate score and minimum-per-principle floor.
#   2. `checks/aggregate-score.sh` — reads the YAML, computes
#      latest-row-wins aggregate, exits 0 (PASS), 1 (CONTINUE), or
#      2 (ESCALATE).
#   3. `docs/reviews/principles-schema.md` — the schema doc the
#      reviewer prompt cites; lives in the rig (not the pack).
#
# Self-pour: when `aggregate-score.sh` exits 1 (CONTINUE), the
# formula re-pours itself with `iteration` incremented. Cap at 3
# iterations; on the 3rd CONTINUE, escalate to operator.
#
# Install (sits directly on the base factory):
#   gc import add --rig <rig-name> artifacts/packs/principles-loop-rig
#
# principles-loop-rig imports architect-rig, the base factory's top
# node, so the architect agent this formula is poured by and the
# refinery patrol that reads its verdict both remain resolvable. It
# does not import any other option, and no other option has to be
# installed first.
#
# WHY THE ARCHITECT AND NOT A REVIEWER. This pack is a formula and a
# check script; it ships no agent of its own, so it has to be poured by
# an agent that already exists. On the base factory that is the
# architect, and the refinery patrol already gates on
# `architect_approved`, which is what this formula stamps. Install the
# domain reviewers option as well and the same loop deepens whichever
# architecture lane that option leaves in place.

[pack]
name = "principles-loop-rig"
schema = 1

[imports.architect-rig]
source = "../architect-rig"
