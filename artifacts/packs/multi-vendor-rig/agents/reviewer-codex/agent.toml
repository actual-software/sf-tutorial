# Reviewer (Codex provider) — vendor-pinned ADR-lane reviewer.
#
# Identical rubric to reviewer-claude and reviewer-gemini. Differs
# only in `provider`, which pins the agent's underlying model CLI.
# Reads the diff and the ADR corpus, stamps
# `vendor_codex_approved` / `vendor_codex_feedback`.

scope = "rig"
provider = "codex"
prompt_template = "agents/shared/vendor-reviewer.template.md"
nudge = "Check your hook for new branches to vendor-review."
idle_timeout = "30m"
min_active_sessions = 0
max_active_sessions = 1
