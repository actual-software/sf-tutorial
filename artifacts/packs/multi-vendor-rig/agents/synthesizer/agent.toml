# Synthesizer — fuses three vendor reviewer verdicts into one ADR-lane
# decision. Reads `vendor_codex_approved`, `vendor_claude_approved`,
# `vendor_gemini_approved` (plus the matching feedback fields), applies
# majority rule, stamps `architect_approved=true|false` on the bead, and
# writes a short `synthesizer_summary` distilling the three reads.

scope = "rig"
prompt_template = "agents/synthesizer/prompt.template.md"
nudge = "Check your hook for new beads to synthesize."
idle_timeout = "30m"
min_active_sessions = 0
max_active_sessions = 1
