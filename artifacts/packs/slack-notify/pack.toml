# slack-notify — an optional Day 2 pack: the factory posts to a Slack channel
# each time it closes a piece of work, with the pull request link when there is
# one.
#
# It rides on gascity-packs' slack-mini, which the lab imports at city scope:
# slack-mini runs the Slack connection and holds the bot token, and its one
# outbound verb, `gc slack-mini post-message`, is what this pack's order calls.
# Its sibling pack, slack-reply, lets the mayor answer mentions. The lab page
# installs all three.
#
# WHAT IT ADDS, on top of a base-factory installation:
#
#   orders/bead-closed-slack.toml   An event order on `bead.closed`, the same
#                                   trigger as base-factory's bead-closed-log,
#                                   with a channel in place of a file.
#   assets/scripts/                 The script the order runs. bash, jq, bd and
#                                   gc, nothing else to install.
#
# It contributes no agents and no formulas, and nothing in it runs a model.
#
# NO IMPORTS, deliberately. slack-mini is a city-scope import with a service
# behind it, and this pack belongs on the rig, so the lab imports each at its
# own scope rather than chaining them. Rig scope, like base-factory's orders, so
# it posts the rig's work and not the city's housekeeping:
#
#   gc import add --rig <rig-name> artifacts/packs/slack-notify
#
# See README.md for the setup and hardening/08-slack-notifications.md for the
# lab.

[pack]
name = "slack-notify"
schema = 1
