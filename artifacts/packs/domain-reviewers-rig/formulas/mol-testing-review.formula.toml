description = """
Testing-lane review of a polecat's feature branch. Poured by the
testing-reviewer agent. Reads the diff against the H1 test-lead's
plan at `metadata.test_plan` plus any `*TEST*` ADRs and
`docs/current/TESTING.md`.

Read-only. Writes only testing-lane verdict metadata
(testing_approved, testing_feedback).
"""

formula = "mol-testing-review"
version = 1

[vars]
[vars.issue]
description = "Bead with metadata.branch and metadata.test_plan"
required = true

[[steps]]
id = "load-context"
title = "Read bead, diff, and testing context"
description = """
```bash
gc prime
bd prime
# Claim the bead for observability — show this gate phase as in_progress in the ledger.
gc bd update {{issue}} --status=in_progress
gc bd show {{issue}}
BRANCH=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.target // \"main\"')
TEST_PLAN=$(gc bd show {{issue}} --json | jq -r '.[0].metadata.test_plan // empty')
git fetch origin
git diff \"origin/$TARGET...origin/$BRANCH\"
[ -n \"$TEST_PLAN\" ] && [ -f \"$TEST_PLAN\" ] && cat \"$TEST_PLAN\"
find docs/decision-records -iname '*TEST*' -name '*.md' -print0 \\
  | xargs -0 -I{} sh -c 'echo \"=== {} ===\"; cat \"{}\"' 2>/dev/null || true
[ -f docs/current/TESTING.md ] && cat docs/current/TESTING.md
```
If test_plan is unset or missing, defer (stamp testing_approved=true)."""

[[steps]]
id = "review-and-record"
title = "Decide approve/reject for the testing lane, reassign to refinery"
needs = ["load-context"]
description = """
**APPROVED:**
```bash
gc bd update {{issue}} --set-metadata testing_approved=true
gc bd note {{issue}} \"testing-reviewer: APPROVED.\"
```

**REJECTED:**
```bash
FEEDBACK=\"<sentence(s) citing missing or weak checks>\"
gc bd update {{issue}} --set-metadata testing_approved=false \\
  --set-metadata testing_feedback=\"$FEEDBACK\"
gc bd note {{issue}} \"testing-reviewer: REJECTED. $FEEDBACK\"
```

Reassign:
```bash
REFINERY_TARGET=\"${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery\"
gc bd update {{issue}} --status=open --assignee=\"$REFINERY_TARGET\" \\
  --set-metadata gc.routed_to=\"$REFINERY_TARGET\"
```
**Exit criterion:** testing_approved set, bead routed to refinery."""

[[steps]]
id = "drain"
title = "Signal completion"
needs = ["review-and-record"]
description = """
```bash
gc runtime drain-ack
```
Run this command and nothing else."""
