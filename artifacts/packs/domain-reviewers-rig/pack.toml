# domain-reviewers-rig — rig-scoped pack that supersedes the
# architect-rig's single architect with FOUR parallel domain
# reviewers (ADR, design, testing, docs). The refinery waits for
# approvals from all four lanes before letting a bead reach the
# inherited approval-review and merge-push steps. Installed in
# Hardening 2.
#
# What this pack contributes:
#   1. `adr-reviewer` — reviews against `docs/decision-records/`
#      (ADRs). Stamps `metadata.adr_approved=true|false` plus
#      `adr_feedback`.
#   2. `design-reviewer` — reviews against `metadata.design_doc`
#      (the Lead's design spec from H1) and any design ADRs.
#      Stamps `metadata.design_approved` and `design_feedback`.
#   3. `testing-reviewer` — reviews against `metadata.test_plan`
#      and testing ADRs. Stamps `metadata.testing_approved` and
#      `testing_feedback`.
#   4. `docs-reviewer` — reviews against `metadata.docs_outline`
#      and `docs/current/`. Stamps `metadata.docs_approved` and
#      `docs_feedback`.
#   5. Four formulas — `mol-adr-review`, `mol-design-review`,
#      `mol-testing-review`, `mol-docs-review` — one per lane.
#   6. `mol-refinery-domain-patrol` — refinery patrol formula that
#      replaces `mol-refinery-architect-patrol`. The new
#      `verify-reviewers` step fans out to any lane whose verdict
#      is unset, aggregates all four, and either proceeds (all
#      approved), bounces (any rejected, under cap), or
#      force-forwards (cap reached).
#   7. A `[[patches.agent]]` that overrides the refinery prompt to
#      point at `mol-refinery-domain-patrol`.
#
# Install (replaces the base factory's single-architect flow with the
# four-lane flow):
#   gc import add --rig <rig-name> artifacts/packs/domain-reviewers-rig
#
# domain-reviewers-rig imports architect-rig, the base factory's top
# node, so the polecat / refinery flow and the patrol formula this
# pack's own patrol extends remain resolvable. It does not import any
# other option, and no other option has to be installed first: the
# four reviewer agents and the patrol that fans out to them all ship
# here.
#
# WHAT THREE OF THE FOUR LANES DO ON THE BARE BASE FACTORY: they
# defer. The design, testing and docs reviewers each read a spec the
# bead-builders Leads write (`metadata.design_doc`, `test_plan`,
# `docs_outline`), and each is written to stamp its lane approved with
# a deferral note when that field is unset rather than block on it. So
# on the base factory alone this option is a real ADR review plus three
# lanes that pass through, and installing the bead builders option as
# well is what turns the other three on. That is by design: the Leads
# are the spec authors and these reviewers are not.

[pack]
name = "domain-reviewers-rig"
schema = 1

[imports.architect-rig]
source = "../architect-rig"

[[patches.agent]]
name = "refinery"
prompt_template = "prompts/refinery.template.md"
