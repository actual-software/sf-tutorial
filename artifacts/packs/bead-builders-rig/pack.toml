# bead-builders-rig — rig-scoped pack that adds three "light-side"
# helper agents (design-lead, test-lead, doc-lead) at the very front
# of the factory, BEFORE the project-manager. Each agent enriches a
# bead with a specific kind of context — design, testing, or
# documentation — by reading the rig's existing docs and writing a
# focused spec back onto the bead. Installed in Hardening 1.
#
# What this pack contributes:
#   1. `design-lead` — reads a bead and the rig's design docs
#      (`docs/decision-records/*DESIGN*.md`, `docs/current/`) and
#      writes a design spec to `docs/design/<bead-id>.md`, stamping
#      `metadata.design_doc=<path>` on the bead.
#   2. `test-lead` — reads a bead and the rig's testing docs (ADR
#      0002 and `docs/current/TESTING.md` if present) and writes a
#      test plan to `docs/testing/<bead-id>.md`, stamping
#      `metadata.test_plan=<path>`.
#   3. `doc-lead` — reads a bead and the rig's docs (`docs/current/`,
#      README) and writes a documentation outline to
#      `docs/outlines/<bead-id>.md`, stamping
#      `metadata.docs_outline=<path>`.
#   4. Three formulas — `mol-design-spec`, `mol-test-spec`,
#      `mol-doc-spec` — one per Lead, each a 3-step formula
#      (load-context → draft-spec → drain).
#
# Install (sits directly on the base factory):
#   gc import add --rig <rig-name> artifacts/packs/bead-builders-rig
#
# bead-builders-rig imports architect-rig, which is the base factory's
# top node, so the architect and the polecat / refinery flow remain
# resolvable transitively. It does not import any other option, and no
# other option has to be installed first.
#
# These agents are "light-side" — they help the operator shape
# higher-quality work with less effort. They are slung explicitly
# (`gc sling <rig>/design-lead <bead> --on mol-design-spec`), so they
# work on the base factory with nothing else added.
#
# WITH THE BEAD GATE OPTION INSTALLED TOO, the project-manager's
# checklist can require these specs to be present before a polecat may
# claim the bead. That pairing is a bonus rather than a prerequisite:
# without it the Leads still write their specs and the reviewers still
# read them.

[pack]
name = "bead-builders-rig"
schema = 1

[imports.architect-rig]
source = "../architect-rig"
